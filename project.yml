name: AirPodKit
options:
  bundleIdPrefix: com.airpodkit
  deploymentTarget:
    macOS: "13.0"
targets:
  AirPodKit:
    type: application
    platform: macOS
    sources:
      - path: AirPodKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airpodkit.app
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "AirPodKit Dev"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: AirPodKit/Info.plist
      properties:
        LSUIElement: true
        NSInputMonitoringUsageDescription: "AirPodKit 需要输入监控权限来检测有线耳机遥控上的按键。"
        NSHumanReadableCopyright: ""
    dependencies:
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework
      - sdk: IOKit.framework
      - sdk: ServiceManagement.framework
